name: Portal match cron

# Hourly backstop for reply reminders, automatic acceptance, and the kickoff
# reminder. Vercel Hobby only allows a daily cron, so portal/vercel.json runs
# once a day and this workflow runs the same route every hour.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  match-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Call the match cron
        env:
          PORTAL_CRON_SECRET: ${{ secrets.PORTAL_CRON_SECRET }}
        run: |
          set -euo pipefail
          # GET and POST run the same handler. One call is enough.
          code="$(curl --silent --show-error --output /tmp/match-cron-body --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${PORTAL_CRON_SECRET}" \
            --max-time 70 \
            https://portal.tryteleforce.com/api/cron/match)"
          cat /tmp/match-cron-body
          echo
          case "$code" in
            2??) exit 0 ;;
            *) echo "Match cron returned HTTP ${code}" >&2; exit 1 ;;
          esac

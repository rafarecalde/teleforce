name: Scheduled rebuild (drip publish)

# Astro filters out posts whose publishDate is in the future, so a backlog of
# dated posts auto-publishes on schedule with no manual step. This daily rebuild
# is what makes the cadence run itself. Adjust the cron to change how often the
# site checks for newly-due posts.
on:
  schedule:
    - cron: '0 13 * * *' # daily at 13:00 UTC (~8–9am US Eastern)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
